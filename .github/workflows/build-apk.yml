name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          cd mobile
          flutter create --platforms=android --org app.timtim --project-name tim_tim _scaffold
          cp -r _scaffold/android android
          rm -rf _scaffold
          python3 tools/prepare_android.py

      - name: Set App Icon
        run: |
          cd mobile
          # Copy the Tim-Tim logo into all Android mipmap density folders
          for dir in android/app/src/main/res/mipmap-*; do
            cp assets/icon.png "$dir/ic_launcher.png"
          done

      - name: Build APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release --dart-define=APP_URL=https://tim-tim-app.onrender.com

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tim-Tim-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
